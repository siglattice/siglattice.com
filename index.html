<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Siglattice</title>
    <meta
      name="description"
      content="Siglattice"
    >
    <style>
      :root {
        --bg: #f5f2ea;
        --panel: rgba(255, 255, 255, 0.72);
        --text: #1f2422;
        --muted: #6a726d;
        --line: rgba(31, 36, 34, 0.1);
        --shadow: 0 18px 48px rgba(31, 36, 34, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(43, 72, 63, 0.08), transparent 28%),
          radial-gradient(circle at bottom right, rgba(143, 116, 84, 0.08), transparent 22%),
          linear-gradient(180deg, #f7f4ed 0%, #f2ece1 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .frame {
        width: min(760px, 100%);
        padding: 28px 28px 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 6vw, 4.2rem);
        line-height: 0.98;
        font-weight: 600;
        letter-spacing: -0.045em;
      }

      p {
        margin: 18px 0 0;
        max-width: 34rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.86rem;
      }

      @media (max-width: 640px) {
        .frame {
          padding: 22px 20px 24px;
          border-radius: 22px;
        }

        h1 {
          font-size: clamp(2rem, 11vw, 3rem);
        }

        p {
          font-size: 0.96rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="frame">
        <div class="eyebrow">Siglattice</div>
        <h1>Structured systems, quietly held.</h1>
        <p>
          A durable public surface for software, operations, and thoughtful digital presence.
        </p>
        <div class="footer">Present now. Able to grow later.</div>
      </section>
    </main>
  </body>
</html>
