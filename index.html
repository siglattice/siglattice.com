<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Siglattice</title>
    <meta name="description" content="Signal lattice.">
    <style>
      :root {
        --bg: #f5f2ea;
        --panel: rgba(255, 255, 255, 0.72);
        --text: #1f2422;
        --muted: #6a726d;
        --line: rgba(31, 36, 34, 0.1);
        --shadow: 0 18px 48px rgba(31, 36, 34, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background:
          radial-gradient(circle at top left, rgba(43, 72, 63, 0.08), transparent 28%),
          radial-gradient(circle at bottom right, rgba(143, 116, 84, 0.08), transparent 22%),
          linear-gradient(180deg, #f7f4ed 0%, #f2ece1 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .frame {
        width: min(760px, 100%);
        padding: 28px 28px 24px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5.8vw, 4rem);
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.045em;
      }

      p {
        margin: 14px 0 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      footer {
        margin-top: 26px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.84rem;
      }

      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(31, 36, 34, 0.18);
      }

      a:hover {
        border-bottom-color: rgba(31, 36, 34, 0.48);
      }

      @media (max-width: 640px) {
        .frame {
          padding: 22px 20px 20px;
          border-radius: 22px;
        }

        h1 {
          font-size: clamp(1.9rem, 10vw, 2.8rem);
        }

        p {
          font-size: 0.94rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="frame">
        <div class="eyebrow">Siglattice</div>
        <h1>Signal lattice.</h1>
        <p>A public marker for structured signal.</p>
        <footer><a href="https://kristopherwilliams.com/">Kristopher Williams</a></footer>
      </section>
    </main>
  </body>
</html>
